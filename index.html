
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chronicle AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="chronicle-intro">
  <div id="intro-scenes"></div>
  <div id="intro-logo"></div>
</div>

<main class="screen mode-login" id="screen">
  <section class="hero">
    <div class="brand">
      <h1>CHRONICLE AI</h1>
      <div class="tags">
        <p class="t-login">Welcome back! Log in to continue.</p>
        <p class="t-signup">Create your account and start your journey.</p>
      </div>
    </div>
    <div class="splash-tag">Everything in one place</div>
  </section>

  <button class="help" type="button" aria-label="Help">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
      <circle cx="12" cy="12" r="10"/>
      <path d="M9.2 9.2a2.9 2.9 0 1 1 4.2 2.6c-.8.4-1.4 1-1.4 1.9"/>
      <circle cx="12" cy="17" r=".6" fill="currentColor"/>
    </svg>
    Help
  </button>

  <form class="form" id="lf" novalidate>
    <h2 class="rise" style="--i:0">Login</h2>
    <div class="rise" style="--i:1">
      <label for="le">Email</label>
      <div class="field">
        <input id="le" type="email" placeholder="you@example.com" autocomplete="email" inputmode="email" required>
      </div>
    </div>
    <div class="rise" style="--i:2">
      <label for="lp">Password</label>
      <div class="field">
        <input id="lp" type="password" placeholder="Enter your password" autocomplete="current-password" required>
        <button class="eye" type="button" data-for="lp" aria-label="Show password" aria-pressed="false">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>
    <button class="forgot rise" style="--i:3" type="button">Forgot password?</button>
    <div class="login-wrap rise" style="--i:4">
      <button class="login" type="submit"><span>Login</span><i></i></button>
    </div>
    <div class="or rise" style="--i:5">Or</div>
    <div class="socials rise" style="--i:6" data-socials></div>
    <div class="bottom rise" style="--i:7">Don’t have an account? <button class="link" type="button" data-go="signup">Sign up</button></div>
  </form>

  <form class="form" id="sf" novalidate>
    <h2 class="rise" style="--i:0">Sign Up</h2>
    <div class="field ic rise" style="--i:1">
      <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <circle cx="12" cy="8" r="3.6"/>
        <path d="M5 20c0-2.6 3-4.4 7-4.4s7 1.8 7 4.4z"/>
      </svg>
      <input id="sn" type="text" placeholder="Full Name" autocomplete="name" aria-label="Full name" required>
    </div>
    <div class="field ic rise" style="--i:2">
      <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="14" rx="3"/>
        <path d="m4 7 8 6 8-6"/>
      </svg>
      <input id="se" type="email" placeholder="Email Address" autocomplete="email" inputmode="email" aria-label="Email address" required>
    </div>
    <div class="field ic rise" style="--i:3">
      <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <rect x="5" y="10.5" width="14" height="10" rx="3"/>
        <path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/>
      </svg>
      <input id="sp" type="password" placeholder="Create Password" autocomplete="new-password" aria-label="Create password" required>
      <button class="eye" type="button" data-for="sp" aria-label="Show password" aria-pressed="false">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
    <div class="field ic rise" style="--i:4">
      <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <rect x="5" y="10.5" width="14" height="10" rx="3"/>
        <path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/>
      </svg>
      <input id="sc" type="password" placeholder="Confirm Password" autocomplete="new-password" aria-label="Confirm password" required>
      <button class="eye" type="button" data-for="sc" aria-label="Show password" aria-pressed="false">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
    <label class="agree rise" style="--i:5;margin-top:0">
      <input id="sa" type="checkbox">
      <span>I agree to the <span class="tl">Terms of Service</span> and <span class="tl">Privacy Policy</span></span>
    </label>
    <div class="login-wrap rise" style="--i:6">
      <button class="login" type="submit"><span>Create Account</span><i></i></button>
    </div>
    <div class="or rise" style="--i:7">Or</div>
    <div class="socials rise" style="--i:8" data-socials></div>
    <div class="bottom rise" style="--i:9">Already have an account? <button class="link" type="button" data-go="login">Login</button></div>
  </form>

  <div class="reveal" id="reveal">
    <h3 id="rt">You’re in</h3>
    <p id="rp">Welcome to Chronicle AI.</p>
    <button id="again" type="button">Start chatting</button>
  </div>

  <div class="chat" id="chat"></div>
</main>

<script src="chat.js"></script>
<script src="app.js"></script>
<script src="logo.js" defer></script>
<script src="intro.js" defer></script>
</body>
</html>
