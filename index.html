<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chronicle AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#0a3df0;--grad:linear-gradient(155deg,#0626c8 0%,#0a45ee 55%,#0a7bff 100%);--paper:#f8f8fa;--ink:#0b1040;--muted:#6b72b8;--field:#fff;--line:#d9dcee;--stage:#0b0d12;--bad:#e03a4a;--hh:36%;
 --ease:cubic-bezier(.77,0,.18,1);--fh:clamp(44px,6.3dvh,52px);--gap:clamp(8px,1.5dvh,12px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--stage);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
button{font-family:inherit}
.screen{position:relative;height:100%;height:100dvh;max-width:430px;margin:0 auto;background:var(--paper);overflow:hidden}
.screen.mode-signup{--hh:30%}
@media (max-height:720px){.screen{--hh:31%}.screen.mode-signup{--hh:27%}}
.hero{position:absolute;left:0;right:0;top:0;height:100%;background:var(--grad);z-index:2;border-bottom-left-radius:0;transition:height 1s var(--ease),border-radius 1s var(--ease)}
.screen.s1 .hero{height:var(--hh);border-bottom-left-radius:92% 58%}
.brand{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;white-space:nowrap;transition:left 1s var(--ease),top 1s var(--ease),transform 1s var(--ease)}
.screen.s1 .brand{left:28px;top:calc(clamp(52px,8dvh,72px) + env(safe-area-inset-top,0px));transform:translate(0,0)}
.brand h1{margin:0;font-size:26px;font-weight:700;letter-spacing:.16em;transition:font-size 1s}
.screen.s1 .brand h1{font-size:23px}
.tags{display:grid;margin-top:8px}
.tags p{grid-area:1/1;margin:0;font-size:15px;line-height:1.3;color:#e6edff;white-space:normal;max-width:250px;opacity:0;transition:opacity .45s}
.screen.s1.mode-login .t-login,.screen.s1.mode-signup .t-signup{opacity:1;transition-delay:.5s}
.splash-tag{position:absolute;left:0;right:0;top:calc(50% + 34px);text-align:center;color:#c3d2fb;font-size:12px;transition:opacity .4s}
.screen.s1 .splash-tag{opacity:0}
.help{position:absolute;right:24px;top:calc(clamp(34px,5dvh,46px) + env(safe-area-inset-top,0px));z-index:3;display:flex;align-items:center;gap:8px;background:none;border:0;color:#fff;font-size:14px;font-weight:600;cursor:pointer;padding:4px;border-radius:10px;opacity:0;transition:opacity .5s}
.screen.s1 .help{opacity:1;transition-delay:.6s}
.help svg{width:24px;height:24px}
.form{position:absolute;left:0;right:0;top:var(--hh);bottom:0;padding:clamp(16px,3.4dvh,32px) 26px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;visibility:hidden;pointer-events:none;transition:top 1s var(--ease),visibility 0s .3s}
.screen.mode-login #lf,.screen.mode-signup #sf{visibility:visible;pointer-events:auto;transition:top 1s var(--ease),visibility 0s 0s}
.rise{opacity:0;transform:translateY(18px);transition:opacity .45s ease,transform .45s ease}
.screen.s2.mode-login #lf .rise,.screen.s2.mode-signup #sf .rise{opacity:1;transform:none;transition:opacity .55s ease,transform .55s ease;transition-delay:calc(var(--i)*70ms + 120ms)}
h2{margin:0 0 clamp(6px,1.6dvh,14px);font-size:clamp(23px,3.6dvh,28px);font-weight:700;letter-spacing:-.01em}
label{display:block;font-size:13px;color:var(--muted);margin:clamp(8px,1.6dvh,14px) 0 6px}
.field{position:relative;margin-bottom:var(--gap)}
#lf .field{margin-bottom:0}
input[type=email],input[type=password],input[type=text]{width:100%;height:var(--fh);padding:0 48px 0 18px;border:1px solid transparent;border-radius:16px;background:var(--field);font-size:16px;font-family:inherit;color:var(--ink);transition:border-color .2s,box-shadow .2s}
input::placeholder{color:#8a90c0}
.field.ic input{padding-left:54px}
.field .lead{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--muted);pointer-events:none}
input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(10,61,240,.15)}
.field.bad input{border-color:var(--bad);box-shadow:0 0 0 3px rgba(224,58,74,.12);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:10px;display:flex;align-items:center;justify-content:center}
.eye:focus-visible,.login:focus-visible,.soc:focus-visible,.link:focus-visible,.help:focus-visible,.forgot:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.forgot{align-self:flex-end;margin-top:10px;font-size:13px;font-weight:500;color:var(--blue);background:none;border:0;cursor:pointer}
.agree{display:flex;align-items:center;gap:12px;font-size:13px;margin:2px 0 0;color:var(--ink);cursor:pointer}
.agree input{appearance:none;-webkit-appearance:none;flex:none;width:24px;height:24px;margin:0;border:1.5px solid var(--muted);border-radius:7px;background:transparent;cursor:pointer;display:grid;place-content:center}
.agree input::after{content:"";width:12px;height:7px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) scale(0);margin-top:-2px;transition:transform .15s}
.agree input:checked{background:var(--blue);border-color:var(--blue)}
.agree input:checked::after{transform:rotate(-45deg) scale(1)}
.agree.bad input{border-color:var(--bad);box-shadow:0 0 0 3px rgba(224,58,74,.15)}
.agree input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.agree a,.agree .tl{color:var(--blue);text-decoration:underline}
.login-wrap{display:flex;justify-content:center;margin-top:clamp(12px,2.4dvh,20px);flex:none}
.login{height:clamp(48px,6.6dvh,54px);width:100%;border:0;border-radius:30px;background:var(--blue);color:#fff;font-size:16px;font-weight:600;cursor:pointer;position:relative;box-shadow:0 8px 18px rgba(10,61,240,.28);transition:width .4s var(--ease),background .3s}
.login span{transition:opacity .2s}
.login.busy{width:52px;pointer-events:none}
.login.busy span{opacity:0}
.login i{position:absolute;inset:14px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;opacity:0;animation:spin .8s linear infinite}
.login.busy i{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
.or{display:flex;align-items:center;gap:12px;margin:clamp(12px,2.4dvh,20px) 0 clamp(10px,1.8dvh,14px);font-size:13px;color:var(--muted)}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.socials{display:flex;justify-content:center;gap:14px;flex:none}
.soc{--c:#111;--w:112px;width:52px;height:52px;flex:none;border-radius:16px;border:0;background:#fff;color:var(--ink);box-shadow:0 4px 12px rgba(20,30,90,.1);display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;cursor:pointer;transition:width .35s cubic-bezier(.4,0,.2,1),background .3s,color .3s,box-shadow .3s}
.soc span{max-width:0;opacity:0;margin-left:0;font-size:13px;font-weight:600;transition:max-width .35s,opacity .3s .05s,margin .35s}
.soc:hover,.soc:focus-visible{width:var(--w);background:var(--c);color:#fff;box-shadow:0 0 14px var(--c),0 0 30px color-mix(in srgb,var(--c) 55%,transparent)}
.soc:hover span,.soc:focus-visible span{max-width:90px;opacity:1;margin-left:8px}
.soc svg{width:24px;height:24px;flex:none;transition:filter .3s}
.soc:hover svg,.soc:focus-visible svg{filter:brightness(0) invert(1)}
.bottom{margin-top:auto;text-align:center;font-size:14px;color:var(--ink);padding-top:clamp(10px,2dvh,16px)}
.link{color:var(--blue);font:inherit;font-weight:700;background:none;border:0;cursor:pointer;padding:0}
.reveal{position:absolute;inset:0;z-index:5;background:var(--grad);clip-path:circle(0 at 50% 82%);transition:clip-path .9s var(--ease);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:30px;visibility:hidden}
.reveal.open{clip-path:circle(150% at 50% 82%);visibility:visible}
.reveal h3{margin:0 0 8px;font-size:28px;font-weight:600;opacity:0;transition:opacity .5s .7s}
.reveal p{margin:0 0 24px;color:#e6edff;opacity:0;transition:opacity .5s .8s}
.reveal button{opacity:0;transition:opacity .5s .9s;padding:12px 22px;border-radius:24px;border:1px solid #fff;background:none;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.reveal.open h3,.reveal.open p,.reveal.open button{opacity:1}
.chat{position:absolute;inset:0;z-index:6;background:var(--paper);display:none;flex-direction:column}
.chat.open{display:flex}
.chat-head{padding:calc(16px + env(safe-area-inset-top,0px)) 20px 14px;background:var(--grad);color:#fff;font-weight:700;letter-spacing:.16em}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:82%;padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.4;white-space:pre-wrap}
.m.user{align-self:flex-end;background:var(--blue);color:#fff}
.m.assistant{align-self:flex-start;background:#fff;box-shadow:0 2px 8px rgba(20,30,90,.08)}
.chat-in{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.chat-in input{flex:1;width:auto;height:48px;padding:0 16px;border:1px solid var(--line)}
.chat-in button{height:48px;border:0;border-radius:16px;background:var(--blue);color:#fff;font-weight:600;padding:0 18px;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}
</style>
</head>
<body>
<main class="screen mode-login" id="screen">
  <section class="hero">
    <div class="brand"><h1>CHRONICLE AI</h1>
      <div class="tags"><p class="t-login">Welcome back! Log in to continue.</p><p class="t-signup">Create your account and start your journey.</p></div>
    </div>
    <div class="splash-tag">Everything in one place</div>
  </section>
  <button class="help" type="button" aria-label="Help"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M9.2 9.2a2.9 2.9 0 1 1 4.2 2.6c-.8.4-1.4 1-1.4 1.9"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg>Help</button>

  <form class="form" id="lf" novalidate>
    <h2 class="rise" style="--i:0">Login</h2>
    <div class="rise" style="--i:1"><label for="le">Email</label><div class="field"><input id="le" type="email" placeholder="you@example.com" autocomplete="email" inputmode="email" required></div></div>
    <div class="rise" style="--i:2"><label for="lp">Password</label>
      <div class="field"><input id="lp" type="password" placeholder="Enter your password" autocomplete="current-password" required>
        <button class="eye" type="button" data-for="lp" aria-label="Show password" aria-pressed="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div></div>
    <button class="forgot rise" style="--i:3" type="button">Forgot password?</button>
    <div class="login-wrap rise" style="--i:4"><button class="login" type="submit"><span>Login</span><i></i></button></div>
    <div class="or rise" style="--i:5">Or</div>
    <div class="socials rise" style="--i:6" data-socials></div>
    <div class="bottom rise" style="--i:7">Don’t have an account? <button class="link" type="button" data-go="signup">Sign up</button></div>
  </form>

  <form class="form" id="sf" novalidate>
    <h2 class="rise" style="--i:0">Sign Up</h2>
    <div class="field ic rise" style="--i:1"><svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-2.6 3-4.4 7-4.4s7 1.8 7 4.4z"/></svg><input id="sn" type="text" placeholder="Full Name" autocomplete="name" aria-label="Full name" required></div>
    <div class="field ic rise" style="--i:2"><svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg><input id="se" type="email" placeholder="Email Address" autocomplete="email" inputmode="email" aria-label="Email address" required></div>
    <div class="field ic rise" style="--i:3"><svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="5" y="10.5" width="14" height="10" rx="3"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg><input id="sp" type="password" placeholder="Create Password" autocomplete="new-password" aria-label="Create password" required>
      <button class="eye" type="button" data-for="sp" aria-label="Show password" aria-pressed="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
    <div class="field ic rise" style="--i:4"><svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="5" y="10.5" width="14" height="10" rx="3"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg><input id="sc" type="password" placeholder="Confirm Password" autocomplete="new-password" aria-label="Confirm password" required>
      <button class="eye" type="button" data-for="sc" aria-label="Show password" aria-pressed="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
    <label class="agree rise" style="--i:5;margin-top:0"><input id="sa" type="checkbox"><span>I agree to the <span class="tl">Terms of Service</span> and <span class="tl">Privacy Policy</span></span></label>
    <div class="login-wrap rise" style="--i:6"><button class="login" type="submit"><span>Create Account</span><i></i></button></div>
    <div class="or rise" style="--i:7">Or</div>
    <div class="socials rise" style="--i:8" data-socials></div>
    <div class="bottom rise" style="--i:9">Already have an account? <button class="link" type="button" data-go="login">Login</button></div>
  </form>

  <div class="reveal" id="reveal"><h3 id="rt">You’re in</h3><p id="rp">Welcome to Chronicle AI.</p><button id="again" type="button">Start chatting</button></div>

  <div class="chat" id="chat">
    <div class="chat-head">CHRONICLE AI</div>
    <div class="msgs" id="msgs"></div>
    <form class="chat-in" id="cf">
      <input id="ci" type="text" placeholder="Message Chronicle AI" autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </div>
</main>
<script>
const screen = document.getElementById('screen');
const reveal = document.getElementById('reveal');
let timers = [];
function later(fn, ms){ timers.push(setTimeout(fn, ms)); }

const SOC = [
 ['Google','#ea4335',106,'<svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.45a5.5 5.5 0 0 1-2.4 3.62v3h3.87c2.27-2.09 3.58-5.17 3.58-8.81z"/><path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.95-2.91l-3.87-3c-1.07.72-2.45 1.15-4.08 1.15-3.13 0-5.78-2.11-6.73-4.96H1.27v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.27 14.28A7.2 7.2 0 0 1 4.9 12c0-.79.14-1.56.37-2.28v-3.1H1.27A12 12 0 0 0 0 12c0 1.94.46 3.77 1.27 5.38l4-3.1z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.43-3.43C17.95 1.19 15.24 0 12 0A12 12 0 0 0 1.27 6.62l4 3.1C6.22 6.86 8.87 4.75 12 4.75z"/></svg>'],
 ['Apple','#111',100,'<svg viewBox="0 0 24 24" fill="#111"><path d="M16.4 12.6c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9-.7 0-1.8-.8-3-.8-1.5 0-3 .9-3.8 2.3-1.6 2.8-.4 7 1.2 9.3.8 1.1 1.7 2.4 2.9 2.3 1.2 0 1.6-.7 3-.7s1.8.7 3 .7c1.3 0 2.1-1.1 2.8-2.3.9-1.3 1.3-2.6 1.3-2.7-.1 0-2.5-1-2.5-3.7zM14.2 5.8c.6-.8 1.1-1.9.9-3-.9 0-2.1.6-2.7 1.4-.6.7-1.1 1.8-1 2.9 1.1.1 2.1-.5 2.8-1.3z"/></svg>'],
 ['Microsoft','#2f6fe4',128,'<svg viewBox="0 0 24 24"><path fill="#f25022" d="M2 2h9.5v9.5H2z"/><path fill="#7fba00" d="M12.5 2H22v9.5h-9.5z"/><path fill="#00a4ef" d="M2 12.5h9.5V22H2z"/><path fill="#ffb900" d="M12.5 12.5H22V22h-9.5z"/></svg>'],
 ['Facebook','#1877f2',118,'<svg viewBox="0 0 24 24" fill="#1877f2"><path d="M3 3h18v18h-6.2v-6.9h2.3l.4-2.8h-2.7V9.6c0-.8.3-1.4 1.4-1.4h1.4V5.7c-.3 0-1.1-.1-2.1-.1-2.1 0-3.5 1.3-3.5 3.6v2.1H9.3v2.8h2.3V21H3z"/></svg>']
];
document.querySelectorAll('[data-socials]').forEach(box => {
  box.innerHTML = SOC.map(([n,c,w,svg]) => `<button class="soc" type="button" aria-label="Continue with ${n}" style="--c:${c};--w:${w}px">${svg}<span>${n}</span></button>`).join('');
});

function resetBusy(){ document.querySelectorAll('.login').forEach(b => b.classList.remove('busy')); }
function setMode(m){
  screen.classList.remove('mode-login','mode-signup');
  screen.classList.add('mode-' + m);
  resetBusy();
  document.querySelectorAll('.form').forEach(f => f.scrollTop = 0);
}
function play(){
  timers.forEach(clearTimeout); timers = [];
  screen.classList.remove('s1','s2');
  reveal.classList.remove('open');
  setMode('login');
  document.querySelectorAll('form').forEach(f => { f.reset(); f.querySelectorAll('.bad').forEach(x => x.classList.remove('bad')); });
  later(() => screen.classList.add('s1'), 1600);
  later(() => screen.classList.add('s2'), 2300);
}

document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => setMode(b.dataset.go)));
document.querySelectorAll('.eye').forEach(b => b.addEventListener('click', () => {
  const i = document.getElementById(b.dataset.for);
  const show = i.type === 'password';
  i.type = show ? 'text' : 'password';
  b.setAttribute('aria-pressed', show);
  b.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
}));
document.querySelectorAll('input').forEach(i => i.addEventListener('input', () => {
  (i.closest('.field') || i.closest('.agree'))?.classList.remove('bad');
}));

function mark(el, bad){ const w = el.
