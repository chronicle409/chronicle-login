<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chronicle AI login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#1747d6;--blue-d:#0f33a6;--grad:linear-gradient(180deg,#0f1fa0 0%,#1747d6 55%,#2a7bf0 100%);--paper:#f3f2ef;--ink:#15171c;--muted:#7b808a;--field:#ffffff;--line:#dddbd6;--stage:#0b0d12}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--stage);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
.screen{position:relative;height:100%;height:100dvh;max-width:430px;margin:0 auto;background:var(--paper);overflow:hidden}
.hero{position:absolute;left:0;right:0;top:0;height:100%;background:var(--grad);z-index:2;
 border-bottom-left-radius:0;transition:height 1s cubic-bezier(.77,0,.18,1),border-radius 1s cubic-bezier(.77,0,.18,1)}
.screen.s1 .hero{height:36%;border-bottom-left-radius:92% 58%}
.brand{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;white-space:nowrap;
 transition:left 1s cubic-bezier(.77,0,.18,1),top 1s cubic-bezier(.77,0,.18,1),transform 1s cubic-bezier(.77,0,.18,1)}
.screen.s1 .brand{left:28px;top:calc(44px + env(safe-area-inset-top,0px));transform:translate(0,0)}
.brand h1{margin:0;font-size:26px;font-weight:700;letter-spacing:.16em;transition:font-size 1s}
.screen.s1 .brand h1{font-size:22px}
.brand p{margin:8px 0 0;font-size:14px;color:#dbe5ff;opacity:0;transition:opacity .6s .5s}
.screen:not(.s1) .brand p{opacity:0}
.screen.s1 .brand p{opacity:1}
.splash-tag{position:absolute;left:0;right:0;top:calc(50% + 34px);text-align:center;color:#c3d2fb;font-size:12px;transition:opacity .4s}
.screen.s1 .splash-tag{opacity:0}
.form{position:absolute;left:0;right:0;top:36%;bottom:0;padding:34px 26px 18px;display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch}
.rise{opacity:0;transform:translateY(18px);transition:opacity .55s ease,transform .55s ease;transition-delay:calc(var(--i)*70ms)}
.screen.s2 .rise{opacity:1;transform:none}
h2{margin:0 0 14px;font-size:24px;font-weight:600}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px}
.field{position:relative}
input{width:100%;height:50px;padding:0 46px 0 16px;border:1px solid transparent;border-radius:12px;background:var(--field);font-size:15px;font-family:inherit;color:var(--ink);transition:border-color .2s,box-shadow .2s}
input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(23,71,214,.15)}
.eye{position:absolute;right:6px;top:5px;width:40px;height:40px;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:10px}
.eye:focus-visible,.login:focus-visible,.soc:focus-visible,.link:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.forgot{align-self:flex-end;margin-top:10px;font-size:12px;color:var(--ink);background:none;border:0;cursor:pointer;font-family:inherit}
.login-wrap{display:flex;justify-content:center;margin-top:18px;flex:none}
.login{height:52px;width:100%;border:0;border-radius:26px;background:var(--blue);color:#fff;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;position:relative;
 transition:width .4s cubic-bezier(.77,0,.18,1),background .3s}
.login span{transition:opacity .2s}
.login.busy{width:52px;pointer-events:none}
.login.busy span{opacity:0}
.login i{position:absolute;inset:14px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;opacity:0;animation:spin .8s linear infinite}
.login.busy i{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
.or{display:flex;align-items:center;gap:12px;margin:20px 0 14px;font-size:12px;color:var(--muted)}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.socials{display:flex;justify-content:center;gap:12px;flex:none}
.soc{--c:#111;--w:100px;width:46px;height:46px;flex:none;border-radius:12px;border:0;background:#fff;color:var(--ink);box-shadow:0 4px 10px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;cursor:pointer;font-family:inherit;
 transition:width .35s cubic-bezier(.4,0,.2,1),background .3s,color .3s,box-shadow .3s}
.soc span{max-width:0;opacity:0;margin-left:0;font-size:13px;font-weight:600;transition:max-width .35s,opacity .3s .05s,margin .35s}
.soc:hover,.soc:focus-visible{width:var(--w);background:var(--c);color:#fff;box-shadow:0 0 14px var(--c),0 0 30px color-mix(in srgb,var(--c) 55%,transparent)}
.soc:hover span,.soc:focus-visible span{max-width:80px;opacity:1;margin-left:8px}
.soc svg{width:20px;height:20px;flex:none}
.bottom{margin-top:auto;text-align:center;font-size:13px;color:var(--muted);padding-top:14px}
.link{color:var(--ink);font-weight:600;background:none;border:0;font:inherit;font-weight:600;cursor:pointer;padding:0}
.reveal{position:absolute;inset:0;z-index:5;background:var(--grad);clip-path:circle(0 at 50% 82%);transition:clip-path .9s cubic-bezier(.77,0,.18,1);
 display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:30px}
.reveal.open{clip-path:circle(150% at 50% 82%)}
.reveal h3{margin:0 0 8px;font-size:28px;font-weight:600;opacity:0;transition:opacity .5s .7s}
.reveal p{margin:0 0 24px;color:#dbe5ff;opacity:0;transition:opacity .5s .8s}
.reveal button{opacity:0;transition:opacity .5s .9s;padding:12px 22px;border-radius:24px;border:1px solid #fff;background:none;color:#fff;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer}
.reveal.open h3,.reveal.open p,.reveal.open button{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}
</style>
</head>
<body>
<main class="screen" id="screen">
  <section class="hero">
    <div class="brand"><h1>CHRONICLE AI</h1><p>Welcome back! Log in to continue.</p></div>
    <div class="splash-tag">Everything in one place</div>
  </section>

  <form class="form" id="form" autocomplete="off">
    <h2 class="rise" style="--i:0">Login</h2>
    <div class="rise" style="--i:1"><label for="e">Email</label><div class="field"><input id="e" type="email" placeholder="you@example.com"></div></div>
    <div class="rise" style="--i:2"><label for="p">Password</label>
      <div class="field"><input id="p" type="password" placeholder="Enter your password">
        <button class="eye" type="button" id="eye" aria-label="Show password"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div></div>
    <button class="forgot rise" style="--i:3" type="button">Forgot password?</button>
    <div class="login-wrap rise" style="--i:4"><button class="login" id="login" type="submit"><span>Login</span><i></i></button></div>
    <div class="or rise" style="--i:5">Or</div>
    <div class="socials rise" style="--i:6">
      <button class="soc" type="button" aria-label="Continue with Google" style="--c:#ea4335;--w:106px"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"/></svg><span>Google</span></button>
      <button class="soc" type="button" aria-label="Continue with Apple" style="--c:#111;--w:100px"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.4 12.6c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9-.7 0-1.8-.8-3-.8-1.5 0-3 .9-3.8 2.3-1.6 2.8-.4 7 1.2 9.3.8 1.1 1.7 2.4 2.9 2.3 1.2 0 1.6-.7 3-.7s1.8.7 3 .7c1.3 0 2.1-1.1 2.8-2.3.9-1.3 1.3-2.6 1.3-2.7-.1 0-2.5-1-2.5-3.7zM14.2 5.8c.6-.8 1.1-1.9.9-3-.9 0-2.1.6-2.7 1.4-.6.7-1.1 1.8-1 2.9 1.1.1 2.1-.5 2.8-1.3z"/></svg><span>Apple</span></button>
      <button class="soc" type="button" aria-label="Continue with Facebook" style="--c:#1877f2;--w:118px"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 8V6.5c0-.7.2-1 1.2-1H17V2h-2.7C11.5 2 10 3.7 10 6.2V8H7.5v3.5H10V22h4V11.5h2.7L17 8h-3z"/></svg><span>Facebook</span></button>
      <button class="soc" type="button" aria-label="Continue with Instagram" style="--c:#e1306c;--w:120px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg><span>Instagram</span></button>
    </div>
    <div class="bottom rise" style="--i:7">Don’t have an account? <button class="link" type="button">Sign up</button></div>
  </form>

  <div class="reveal" id="reveal"><h3>You’re in</h3><p>Welcome to Chronicle AI.</p><button id="again" type="button">Replay animation</button></div>
</main>
<script>
const screen = document.getElementById('screen');
const reveal = document.getElementById('reveal');
const login = document.getElementById('login');
let timers = [];
function later(fn, ms){ timers.push(setTimeout(fn, ms)); }
function play(){
  timers.forEach(clearTimeout); timers = [];
  screen.classList.remove('s1','s2');
  reveal.classList.remove('open');
  login.classList.remove('busy');
  later(() => screen.classList.add('s1'), 1600);
  later(() => screen.classList.add('s2'), 2300);
}
document.getElementById('eye').addEventListener('click', () => {
  const p = document.getElementById('p');
  p.type = p.type === 'password' ? 'text' : 'password';
});
document.getElementById('form').addEventListener('submit', e => {
  e.preventDefault();
  login.classList.add('busy');
  later(() => reveal.classList.add('open'), 1300);
});
document.getElementById('again').addEventListener('click', play);
play();
</script>
</body>
</html>
